# Live-Stand der Seniors 1 von FuPa nach data/live.json (gelesen von fussball.html).
# Startet nur 4× am Tag. Liegt in den nächsten gut 3 Stunden ein Anstoß der Seniors 1, bleibt
# der Lauf an: wartet bis 15 min vor Anstoß, fragt dann alle 2 min FuPa und committet jede
# Änderung selbst (tools/fussball-live.mjs --wache). Sonst ist er nach Sekunden fertig.
# Seniors stoßen 2025-27 zwischen 14 und 20 Uhr an; jeder Start deckt Anstöße bis 200 min
# voraus ab (+150 min Spiel < 6 h, das Limit eines GitHub-Laufs). Der vierte Start (19:23) ist
# für Abendspiele bis etwa 22:40 (vom Nutzer gefragt: „und wenn mal um 21 Uhr was startet?“).
name: Fussball-Live

on:
  schedule:
    # UTC. Winter 11:23, 14:23, 17:23, 19:23 Uhr in Luxemburg, Sommer eine Stunde später.
    - cron: "23 10,13,16,18 * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write   # für das Wach-halten unten

concurrency:
  group: fussball-live
  cancel-in-progress: false

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tools/fussball-live.mjs --wache
      # Wie bei Fussball-Daten: Zeitplan nach 60 Tagen ohne Commit sonst abgeschaltet.
      - name: Zeitplan wach halten
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/fussball-live.yml/enable"
