# Nach dem Umzug der App „FC Koeppchen“ nach https://fckoeppchen.github.io/ (vom Nutzer, 22.10.2026; vorbereitet 30.10.2026):
# kein FLF-Abruf mehr hier. Nur noch der Kalender-Spiegel — alte Abos (kalender/*.ics hier) bekommen bis Ende 2026 die
# Spiele der neuen App, mit Hinweis „bitte neu abonnieren“ (tools/kalender-spiegel.mjs). Danach abschalten.
# Der alte Worker (koeppchen-live) stößt diesen Workflow weiter an, das schadet nicht.
name: Fussball-Daten

on:
  schedule:
    - cron: "23 */3 * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: fussball
  cancel-in-progress: false

jobs:
  spiegel:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tools/kalender-spiegel.mjs
      - name: Commit, falls sich etwas geändert hat
        run: |
          git add kalender
          if git diff --cached --quiet; then echo "keine Änderung"; exit 0; fi
          git config user.name "fussball-abruf"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Kalender-Spiegel: Stand der neuen App"
          for i in 1 2 3; do
            git pull --rebase -X theirs origin main && git push origin HEAD:main && exit 0
            git rebase --abort 2>/dev/null || true
            sleep $((i * 10))
          done
          exit 1
      - name: Zeitplan wach halten
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/fussball.yml/enable"
