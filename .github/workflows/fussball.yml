# Holt Spiele und Tabellen der U13 Minimes des FC Koeppchen von der FLF
# und legt sie als data/fussball.json ab (gelesen von fussball.html).
name: Fussball-Daten

on:
  schedule:
    # Zeiten in UTC. Alle zwei Stunden, dazu samstags nachmittags stündlich (Spieltag).
    - cron: "17 */2 * * *"
    - cron: "47 11-19 * * 6"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fussball
  cancel-in-progress: false

jobs:
  abruf:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node test/fussball.mjs
      - run: node tools/fussball.mjs
      - name: Commit, falls sich etwas geändert hat
        run: |
          git add data/fussball.json
          if git diff --cached --quiet; then echo "keine Änderung"; exit 0; fi
          git config user.name "fussball-abruf"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Fußball: Daten aktualisiert"
          for i in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep $((i * 10))
          done
          exit 1
