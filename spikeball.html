<style>
  :root{
    --bg:#0e1116; --panel:#161b22; --panel2:#1c232c; --line:#2a313c;
    --text:#e8ecf1; --muted:#8a94a3; --accent:#ffb340; --sea:#2fd0c5;
    --good:#3ecf6a; --bad:#ff5d6b;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:Barlow,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
  body{padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
  header{position:sticky;top:0;z-index:20;background:linear-gradient(180deg,var(--panel),rgba(22,27,34,.94));backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
  .wrap{max-width:820px;margin:0 auto;padding:12px 14px 10px}
  h1{font-family:'Bebas Neue',sans-serif;letter-spacing:1.5px;margin:0;font-size:30px;color:var(--accent)}
  .sub{color:var(--muted);font-size:13px;margin-top:2px}
  main{max-width:820px;margin:0 auto;padding:12px 12px 90px}
  h2{font-family:'Bebas Neue',sans-serif;letter-spacing:1.2px;font-size:21px;margin:22px 0 8px;color:var(--sea)}
  h2:first-child{margin-top:4px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px;margin:10px 0}
  .card + .card{margin-top:8px}
  label.lbl{display:block;font-size:12.5px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.6px;margin-bottom:6px}
  .card .sec{font-family:'Bebas Neue',sans-serif;font-size:18px;letter-spacing:1px;color:var(--text);margin-bottom:10px}
  input[type=text]{background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:10px;padding:11px 12px;font-size:16px;font-family:inherit;width:100%}
  input:focus{outline:none;border-color:var(--accent)}
  .row{display:flex;gap:8px;align-items:center}
  .seg{display:flex;background:var(--panel2);border:1px solid var(--line);border-radius:10px;overflow:hidden;flex-wrap:wrap}
  .seg button{flex:1;background:transparent;color:var(--muted);border:0;padding:11px 10px;font-family:inherit;font-weight:700;font-size:13.5px;cursor:pointer;white-space:nowrap}
  .seg button.on{background:var(--accent);color:#231600}
  button.btn{background:var(--accent);color:#231600;border:0;border-radius:12px;padding:13px 16px;font-family:'Bebas Neue',sans-serif;font-size:20px;letter-spacing:1px;cursor:pointer;width:100%}
  button.btn.ghost{background:var(--panel2);color:var(--text);border:1px solid var(--line)}
  button.btn:active{transform:scale(.98)}
  button.btn[disabled]{opacity:.4;cursor:not-allowed}
  .mini{background:var(--panel2);color:var(--muted);border:1px solid var(--line);border-radius:9px;padding:8px 11px;font-family:inherit;font-weight:700;font-size:13px;cursor:pointer}
  .players{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
  .chip{display:flex;align-items:center;gap:7px;background:var(--panel2);border:1px solid var(--line);border-radius:999px;padding:7px 8px 7px 12px;font-size:14.5px;font-weight:600}
  .chip b{color:var(--muted);font-weight:700;font-size:11px}
  .chip .x{background:none;border:0;color:var(--muted);font-size:17px;line-height:1;cursor:pointer;padding:0 3px}
  .hint{color:var(--muted);font-size:12.5px;margin-top:8px;line-height:1.45}
  .warn{color:var(--accent)}
  .grp{background:var(--panel);border:1px solid var(--line);border-radius:14px;margin:10px 0;overflow:hidden}
  .ghead{padding:9px 12px;background:var(--panel2);font-family:'Bebas Neue',sans-serif;font-size:19px;letter-spacing:1px;border-bottom:1px solid var(--line)}
  table{width:100%;border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums}
  th{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.5px;text-align:right;padding:7px 5px;font-weight:700}
  th:nth-child(2){text-align:left}
  td{padding:8px 5px;text-align:right;border-top:1px solid var(--line)}
  td:nth-child(2){text-align:left;font-weight:600}
  td:first-child,th:first-child{padding-left:12px;color:var(--muted);font-family:Menlo,monospace;font-size:12px}
  td:last-child,th:last-child{padding-right:12px;font-weight:700}
  tr.q td{background:rgba(62,207,106,.09)}
  tr.q td:nth-child(2)::after{content:' ✓';color:var(--good)}
  .m{display:flex;align-items:center;gap:8px;padding:9px 10px;border-top:1px solid var(--line)}
  .m:first-child{border-top:0}
  .m .side{flex:1;min-width:0;font-size:14.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .m .side.r{text-align:right}
  .m .side.win{color:var(--good);font-weight:700}
  .m .side.tbd{color:var(--muted);font-style:italic}
  .sc{display:flex;flex-direction:column;gap:5px;flex:none}
  .sr{display:flex;align-items:center;gap:6px}
  .sr input{width:44px;padding:7px 3px;text-align:center;font-weight:700;font-size:16px;font-variant-numeric:tabular-nums}
  .sr .vs{color:var(--muted);font-size:12px}
  .mnote{padding:0 10px 9px;font-size:11.5px;color:var(--muted);text-align:center}
  .mnote.open{color:var(--accent)}
  .rlab{padding:7px 12px;background:var(--panel2);color:var(--muted);font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.7px;border-top:1px solid var(--line)}
  .bye{color:var(--muted);font-size:12px;padding:0 4px}
  .champ{text-align:center;padding:18px 12px;background:linear-gradient(160deg,rgba(255,179,64,.18),var(--panel));border:1px solid var(--accent);border-radius:14px;margin:12px 0}
  .champ .t{font-family:'Bebas Neue',sans-serif;font-size:34px;letter-spacing:1.5px;color:var(--accent);line-height:1.1}
  .champ .l{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:1px}
  .foot{display:flex;gap:8px;margin-top:18px}
  .foot button{flex:1}
</style>
</head>
<body>
<header><div class="wrap">
  <h1 id="title">Turnierplaner</h1>
  <div class="sub" id="sub">Namen eintragen, mischen, spielen.</div>
</div></header>
<main id="app"></main>

<script>
(function(){
"use strict";
const KEY = 'turnierplaner-v2', OLDKEY = 'spikeball-turnier-v1';
const $ = (s,r)=> (r||document).querySelector(s);
const esc = s => String(s==null?'':s).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const num = v => v==='' || v===null || v===undefined || isNaN(+v) ? null : +v;

/* ---------- state ---------- */
const defRules = () => ({
  g:{ sets:1, target:21, two:true },   /* Gruppenphase */
  k:{ sets:3, target:21, two:true }    /* K.-o.-Phase  */
});
const fresh = () => ({
  phase:'setup',
  players:[],
  teamSize:2,
  mode:'gruppen',       /* 'ko' | 'gruppen' */
  nGroups:2,
  qual:2,
  koAfterGroups:true,
  rules: defRules(),
  showRules:false,
  teams:[], groups:[], gm:[], ko:null
});
let S = load();

function load(){
  let r=null, fromOld=false;
  try{ r = JSON.parse(localStorage.getItem(KEY)); }catch(e){}
  if(!r){ try{ r = JSON.parse(localStorage.getItem(OLDKEY)); fromOld = !!r; }catch(e){} }
  if(!r || !r.phase) return fresh();
  return migrate(Object.assign(fresh(), r), fromOld);
}
/* Alte Turniere (eine Zahl pro Partie, kein Zielwert) weiterverwenden */
function migrate(st, fromOld){
  const fix = o => { if(o && o.s===undefined){ o.s = (o.sa||o.sb) ? [[o.sa||'', o.sb||'']] : []; delete o.sa; delete o.sb; } };
  (st.gm||[]).forEach(fix);
  if(st.ko){ (st.ko.rounds||[]).forEach(r=> r.forEach(fix)); fix(st.ko.third); }
  if(fromOld) st.rules = { g:{sets:1,target:null,two:false}, k:{sets:1,target:null,two:false} };
  if(!st.rules || !st.rules.g || !st.rules.k) st.rules = defRules();
  return st;
}
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }

/* ---------- Satz- und Partielogik ---------- */
/* Ergebnis eines Satzes: 'a', 'b', 'd' (unentschieden) oder null (noch offen) */
function setResult(x, y, R){
  const A = num(x), B = num(y);
  if(A===null || B===null) return null;
  if(R.target && Math.max(A,B) < R.target) return null;
  const d = Math.abs(A-B);
  if(R.two && d < 2) return null;
  if(d === 0) return R.target ? null : 'd';
  return A > B ? 'a' : 'b';
}
/* Warum ist ein eingetragener Satz noch nicht gewertet? */
function setProblem(x, y, R){
  const A = num(x), B = num(y);
  if(A===null || B===null) return null;
  if(R.target && Math.max(A,B) < R.target) return 'noch nicht zu Ende (bis '+R.target+')';
  if(R.two && Math.abs(A-B) < 2) return 'zwei Punkte Vorsprung nötig';
  if(A===B && R.target) return 'kein Sieger';
  return null;
}
/* Partie auswerten. isKO: bei "2 Sätze" entscheidet dort ein dritter Satz. */
function evalMatch(sets, R, isKO){
  const need = R.sets===1 ? 1 : 2;
  const maxRows = (R.sets===2 && isKO) ? 3 : R.sets;
  let wa=0, wb=0, pa=0, pb=0, played=0;
  for(let i=0; i<sets.length && i<maxRows; i++){
    const r = setResult(sets[i][0], sets[i][1], R);
    if(!r) break;
    played++;
    pa += num(sets[i][0]); pb += num(sets[i][1]);
    if(r==='a') wa++; else if(r==='b') wb++;
    if(wa>=need || wb>=need) break;
  }
  const w = wa>=need ? 'a' : wb>=need ? 'b' : null;
  const drawn = !w && played>=maxRows && wa===wb;
  return { w, drawn, wa, wb, pa, pb, played, maxRows };
}
const matchDone = ev => !!ev.w || ev.drawn;
const rulesOf = isKO => isKO ? S.rules.k : S.rules.g;
function rulesText(R, isKO){
  const bo = R.sets===1 ? 'ein Satz' : R.sets===2 ? (isKO ? '2 Sätze (+ Entscheidungssatz)' : '2 Sätze') : 'Best of 3';
  return bo + (R.target ? ' bis '+R.target : ' (ohne Zielwert)') + (R.two ? ', 2 Punkte Vorsprung' : '');
}

/* ---------- Hilfen ---------- */
function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
const team = id => S.teams.find(t=>t.id===id);
const tname = id => id===null||id===undefined ? null : (team(id)||{name:'?'}).name;

function makeTeams(){
  const ps = shuffle(S.players), k = S.teamSize;
  if(k===1) return ps.map((p,i)=>({id:i,name:p}));
  const n = Math.max(1, Math.floor(ps.length/k));
  const buckets = Array.from({length:n},()=>[]);
  ps.forEach((p,i)=> buckets[i%n].push(p));
  return buckets.map((b,i)=>({id:i,name:b.join(' & ')}));
}
function roundRobin(ids){
  let a = ids.slice();
  if(a.length<2) return [];
  if(a.length%2) a.push(null);
  const n=a.length, rounds=[];
  for(let r=0;r<n-1;r++){
    const pairs=[];
    for(let i=0;i<n/2;i++){
      const x=a[i], y=a[n-1-i];
      if(x!==null && y!==null) pairs.push(r%2 ? [y,x] : [x,y]);
    }
    rounds.push(pairs);
    a = [a[0]].concat([a[n-1]], a.slice(1,n-1));
  }
  return rounds;
}
function buildGroupMatches(){
  S.gm = [];
  S.groups.forEach((ids,g)=>{
    roundRobin(ids).forEach((pairs,r)=>{
      pairs.forEach(p=> S.gm.push({g:g, r:r, a:p[0], b:p[1], s:[]}));
    });
  });
}

/* ---------- K.-o.-Baum ---------- */
function seedOrder(size){
  let o=[1];
  while(o.length<size){ const n=o.length*2, x=[]; o.forEach(s=>{ x.push(s, n+1-s); }); o=x; }
  return o;
}
function buildKO(seed){
  let size=1; while(size < seed.length) size*=2;
  if(size<2) size=2;
  let slots = seedOrder(size).map(pos => seed[pos-1]===undefined ? null : seed[pos-1]);
  slots = avoidSameGroup(slots);
  const rounds=[]; let cnt=size/2;
  while(cnt>=1){ rounds.push(Array.from({length:cnt},()=>({s:[]}))); cnt/=2; }
  return { seed: slots.map(x=> x ? x.id : null), rounds, third:{s:[]} };
}
/* Erste Runde: keine zwei Teams aus derselben Gruppe gegeneinander. */
function avoidSameGroup(slots){
  const clash = m => { const a=slots[2*m], b=slots[2*m+1]; return !!(a && b && a.g!=null && a.g===b.g); };
  const N = slots.length/2;
  [true,false].forEach(sameTierOnly=>{
    for(let pass=0; pass<3; pass++){
      for(let m=0;m<N;m++){
        if(!clash(m)) continue;
        let fixed=false;
        for(let n=0;n<N && !fixed;n++){
          if(n===m) continue;
          for(let i=0;i<2 && !fixed;i++) for(let j=0;j<2 && !fixed;j++){
            const A=slots[2*m+i], B=slots[2*n+j];
            if(!A || !B) continue;
            if(sameTierOnly && A.tier!==B.tier) continue;
            slots[2*m+i]=B; slots[2*n+j]=A;
            if(!clash(m) && !clash(n)) fixed=true; else { slots[2*m+i]=A; slots[2*n+j]=B; }
          }
        }
      }
    }
  });
  return slots;
}
function resolveKO(){
  const ko = S.ko; if(!ko) return null;
  const R = ko.rounds.map(r=> r.map(()=>({a:undefined,b:undefined,w:undefined,l:undefined})));
  for(let m=0;m<R[0].length;m++){ R[0][m].a = ko.seed[m*2]; R[0][m].b = ko.seed[m*2+1]; }
  for(let r=0;r<R.length;r++){
    for(let m=0;m<R[r].length;m++){
      const M=R[r][m];
      if(M.a===null && M.b===null){ M.w=null; }
      else if(M.a===null && M.b!=null){ M.w=M.b; }
      else if(M.b===null && M.a!=null){ M.w=M.a; }
      else if(M.a!=null && M.b!=null){
        const ev = evalMatch(ko.rounds[r][m].s||[], S.rules.k, true);
        if(ev.w){ M.w = ev.w==='a' ? M.a : M.b; M.l = ev.w==='a' ? M.b : M.a; }
      }
      if(M.w!==undefined && r+1<R.length){
        const nx = R[r+1][Math.floor(m/2)];
        if(m%2===0) nx.a=M.w; else nx.b=M.w;
      }
    }
  }
  const semis = R.length>=2 ? R[R.length-2] : null;
  const third = semis && semis.length===2 ? {a:semis[0].l, b:semis[1].l} : null;
  if(third && third.a!==undefined && third.b!==undefined){
    const ev = evalMatch(ko.third.s||[], S.rules.k, true);
    if(ev.w) third.w = ev.w==='a' ? third.a : third.b;
  }
  const fin = R[R.length-1][0];
  return { R, third, champ: fin.w, second: fin.w!==undefined ? (fin.a===fin.w ? fin.b : fin.a) : undefined };
}
function roundName(r,total){
  const left = total-r;
  return left===1?'Finale' : left===2?'Halbfinale' : left===3?'Viertelfinale' : left===4?'Achtelfinale' : 'Runde '+(r+1);
}

/* ---------- Tabelle ---------- */
function tableFor(g){
  const R = S.rules.g;
  const rows = S.groups[g].map(id=>({id, name:tname(id), sp:0,s:0,u:0,n:0, sw:0,sl:0, pf:0,pa:0, p:0}));
  const by={}; rows.forEach(r=> by[r.id]=r);
  S.gm.filter(m=>m.g===g).forEach(m=>{
    const ev = evalMatch(m.s||[], R, false);
    if(!matchDone(ev)) return;
    const A=by[m.a], B=by[m.b]; if(!A||!B) return;
    A.sp++; B.sp++;
    A.sw+=ev.wa; A.sl+=ev.wb; B.sw+=ev.wb; B.sl+=ev.wa;
    A.pf+=ev.pa; A.pa+=ev.pb; B.pf+=ev.pb; B.pa+=ev.pa;
    if(ev.w==='a'){ A.s++; B.n++; A.p+=2; }
    else if(ev.w==='b'){ B.s++; A.n++; B.p+=2; }
    else { A.u++; B.u++; A.p++; B.p++; }
  });
  rows.sort((a,b)=> b.p-a.p || (b.sw-b.sl)-(a.sw-a.sl) || (b.pf-b.pa)-(a.pf-a.pa) || b.pf-a.pf || a.name.localeCompare(b.name));
  return rows;
}
const groupDone = g => S.gm.filter(m=>m.g===g).every(m=> matchDone(evalMatch(m.s||[], S.rules.g, false)));
const allGroupsDone = () => S.groups.every((_,g)=> groupDone(g));

/* Setzliste: erst alle Gruppensieger, dann alle Zweiten, je nach Stärke. */
function qualifiers(){
  const tabs = S.groups.map((_,g)=> tableFor(g));
  const maxQ = Math.min.apply(null, tabs.map(t=>t.length));
  const q = Math.max(1, Math.min(S.qual, maxQ));
  const seed=[];
  for(let pos=0; pos<q; pos++){
    const tier = tabs.map((t,g)=>({ id:t[pos].id, g:g, tier:pos, p:t[pos].p, sd:t[pos].sw-t[pos].sl, d:t[pos].pf-t[pos].pa }));
    tier.sort((a,b)=> b.p-a.p || b.sd-a.sd || b.d-a.d);
    tier.forEach(x=> seed.push(x));
  }
  return seed;
}

/* ---------- Ansicht ---------- */
const app = $('#app');
function render(){
  const act = document.activeElement;
  const key = act && act.dataset && act.dataset.k ? act.dataset.k : null;
  app.innerHTML = S.phase==='setup' ? viewSetup() : viewTurnier();
  if(key){ const el = app.querySelector('[data-k="'+key+'"]'); if(el){ el.focus(); try{ el.setSelectionRange(el.value.length, el.value.length); }catch(e){} } }
  $('#sub').textContent = S.phase==='setup'
    ? 'Namen eintragen, mischen, spielen.'
    : (S.mode==='ko' ? 'K.-o.-System · ' : 'Gruppen + K.o. · ') + S.teams.length + ' Teams';
}

function segRow(seg, opts, cur){
  return '<div class="seg" data-seg="'+seg+'">' + opts.map(o=>
    '<button data-v="'+o[0]+'" class="'+(String(cur)===String(o[0])?'on':'')+'">'+o[1]+'</button>').join('') + '</div>';
}
function rulesCard(which){
  const R = S.rules[which], isKO = which==='k';
  const sets = [[1,'1 Satz'],[2,'2 Sätze'],[3,'Best of 3']];
  let h = '<div class="card"><div class="sec">'+(isKO?'K.-o.-Phase':'Gruppenphase')+'</div>';
  h += '<label class="lbl">Sätze</label>' + segRow('r:'+which+':sets', sets, R.sets);
  h += '<div class="hint">'+(R.sets===1 ? 'Eine Partie = ein Satz.'
      : R.sets===2 ? (isKO ? 'Steht es 1:1, erscheint automatisch ein Entscheidungssatz.' : 'Steht es 1:1, ist die Partie unentschieden.')
      : 'Wer zwei Sätze gewinnt, gewinnt die Partie.')+'</div>';
  h += '<div style="margin-top:12px"><label class="lbl">Ein Satz geht bis</label>'
     + '<input type="text" inputmode="numeric" maxlength="3" data-target="'+which+'" value="'+esc(R.target||'')+'" placeholder="z. B. 21">'
     + '<div class="hint">Leer lassen = kein Zielwert, dann zählt jedes eingetragene Ergebnis (bei Gleichstand unentschieden).</div></div>';
  h += '<div style="margin-top:12px"><label class="lbl">Zwei Punkte Vorsprung nötig</label>'
     + segRow('r:'+which+':two', [[1,'Ja'],[0,'Nein']], R.two?1:0) + '</div>';
  return h + '</div>';
}

function viewSetup(){
  const n = S.players.length, k = S.teamSize;
  const nTeams = k===1 ? n : Math.max(1, Math.floor(n/k));
  const rest = k===1 ? 0 : n % k;
  let h = '';

  h += '<h2>1 · Teilnehmer</h2><div class="card">';
  h += '<div class="row"><input type="text" id="pname" placeholder="Name eingeben" autocomplete="off" enterkeyhint="done"><button class="mini" id="padd" style="padding:11px 14px">+</button></div>';
  h += '<div class="players">' + S.players.map((p,i)=>'<span class="chip"><b>'+(i+1)+'</b>'+esc(p)+'<button class="x" data-del="'+i+'">×</button></span>').join('') + '</div>';
  h += '<div class="hint">'+n+' Teilnehmer'+(n?' · <button class="mini" id="clearAll" style="padding:3px 8px">alle löschen</button>':'')+'</div></div>';

  h += '<h2>2 · Teams</h2><div class="card">';
  h += '<label class="lbl">Teamgröße</label>' + segRow('teamSize', [[1,'Einzel (1)'],[2,'2er-Team'],[3,'3er-Team']], k);
  h += '<div class="hint">ergibt <b>'+nTeams+' Teams</b>'
     + (rest ? ' <span class="warn">· '+rest+' übrige Spieler werden verteilt (ein Team mit '+(k+1)+' Spielern)</span>' : '') + '</div></div>';

  h += '<h2>3 · Modus</h2><div class="card">';
  h += segRow('mode', [['gruppen','Gruppen'],['ko','Nur K.o.']], S.mode);
  if(S.mode==='gruppen'){
    h += '<div style="margin-top:12px"><label class="lbl">Anzahl Gruppen</label>' + segRow('nGroups', [[1,'1'],[2,'2'],[3,'3'],[4,'4']], S.nGroups);
    h += '<div class="hint">'+(S.nGroups===1 ? 'Eine Gruppe = jeder gegen jeden.' : 'ca. '+Math.floor(nTeams/S.nGroups)+' Teams pro Gruppe.')+'</div>';
    h += '<div style="margin-top:12px"><label class="lbl">Danach K.o.-Phase</label>' + segRow('koAfterGroups', [[1,'Ja'],[0,'Nein, nur Tabelle']], S.koAfterGroups?1:0);
    if(S.koAfterGroups){
      h += '<div style="margin-top:12px"><label class="lbl">Wie viele pro Gruppe weiter?</label>' + segRow('qual', [[1,'Top 1'],[2,'Top 2'],[4,'Top 4']], S.qual) + '</div>';
    }
    h += '</div>';
  }
  h += '</div>';

  h += '<h2>4 · Spielregeln</h2>';
  if(S.mode==='gruppen') h += rulesCard('g');
  if(S.mode==='ko' || S.koAfterGroups) h += rulesCard('k');

  const ok = nTeams>=2;
  h += '<button class="btn" id="start" '+(ok?'':'disabled')+'>Teams auslosen &amp; starten</button>';
  if(!ok) h += '<div class="hint">Mindestens 2 Teams nötig.</div>';
  return h;
}

function viewTurnier(){
  let h = '';
  h += '<div class="card"><label class="lbl">'+S.teams.length+' Teams</label><div class="players">'
     + S.teams.map((t,i)=>'<span class="chip"><b>'+(i+1)+'</b>'+esc(t.name)+'</span>').join('') + '</div></div>';

  h += '<div class="card" style="padding:10px 12px"><div class="row" style="justify-content:space-between;gap:10px">'
     + '<div style="font-size:12.5px;color:var(--muted);line-height:1.5">'
     + (S.mode==='gruppen' ? '<b>Gruppen:</b> '+esc(rulesText(S.rules.g,false))+'<br>' : '')
     + ((S.mode==='ko'||S.koAfterGroups) ? '<b>K.o.:</b> '+esc(rulesText(S.rules.k,true)) : '')
     + '</div><button class="mini" id="toggleRules">'+(S.showRules?'fertig':'ändern')+'</button></div></div>';
  if(S.showRules){
    if(S.mode==='gruppen') h += rulesCard('g');
    if(S.mode==='ko' || S.koAfterGroups) h += rulesCard('k');
  }

  if(S.mode==='gruppen'){
    const R = S.rules.g;
    S.groups.forEach((ids,g)=>{
      const rows = tableFor(g);
      let q = S.koAfterGroups ? S.qual : 0;
      if(q >= rows.length) q = 0;
      h += '<div class="grp"><div class="ghead">'+(S.groups.length>1?'Gruppe '+String.fromCharCode(65+g):'Tabelle')+'</div>';
      h += '<table><thead><tr><th>#</th><th>Team</th><th>Sp</th><th>S</th><th>N</th>'
         + (R.sets>1?'<th>Sätze</th>':'') + '<th>+/−</th><th>Pkt</th></tr></thead><tbody>';
      rows.forEach((r,i)=>{
        const d = r.pf-r.pa;
        h += '<tr class="'+(i<q?'q':'')+'"><td>'+(i+1)+'</td><td>'+esc(r.name)+'</td><td>'+r.sp+'</td><td>'+r.s+'</td><td>'+r.n+'</td>'
           + (R.sets>1?'<td>'+r.sw+':'+r.sl+'</td>':'') + '<td>'+(d>0?'+':'')+d+'</td><td>'+r.p+'</td></tr>';
      });
      h += '</tbody></table>';
      let lastR=-1;
      S.gm.forEach((m,i)=>{
        if(m.g!==g) return;
        if(m.r!==lastR){ h += '<div class="rlab">Runde '+(m.r+1)+'</div>'; lastR=m.r; }
        h += matchRow(m.a, m.b, m, R, false, 'g|'+i+'|');
      });
      h += '</div>';
    });

    if(S.koAfterGroups && !S.ko){
      const done = allGroupsDone();
      h += '<h2>K.o.-Phase</h2><button class="btn" id="mkko" '+(done?'':'disabled')+'>K.-o.-Runde starten</button>';
      h += '<div class="hint">'+(done?'Alle Gruppenspiele sind eingetragen.':'Erst alle Gruppenspiele zu Ende eintragen.')+'</div>';
    }
  }

  if(S.ko) h += viewKO();

  h += '<div class="foot"><button class="btn ghost" id="reshuffle">Neu auslosen</button>'
     + '<button class="btn ghost" id="reset">Neues Turnier</button></div>';
  return h;
}

function viewKO(){
  const res = resolveKO(), ko = S.ko, R = S.rules.k;
  let h = '<h2>'+(S.mode==='ko'?'K.-o.-Turnier':'K.-o.-Phase')+'</h2><div class="grp">';
  ko.rounds.forEach((round,r)=>{
    h += '<div class="rlab">'+roundName(r, ko.rounds.length)+'</div>';
    round.forEach((sc,m)=>{
      const M = res.R[r][m];
      if(M.a===null || M.b===null){
        const t = M.a===null ? M.b : M.a;
        h += '<div class="m"><div class="side">'+(t===undefined||t===null?'<span class="tbd">offen</span>':esc(tname(t)))+'</div><div class="bye">Freilos →</div></div>';
      } else {
        h += matchRow(M.a, M.b, sc, R, true, 'k|'+r+'-'+m+'|');
      }
    });
  });
  if(res.third && res.third.a!==undefined && res.third.b!==undefined){
    h += '<div class="rlab">Spiel um Platz 3</div>' + matchRow(res.third.a, res.third.b, ko.third, R, true, 't||');
  }
  h += '</div>';
  if(res.champ!==undefined && res.champ!==null){
    h += '<div class="champ"><div class="l">Sieger</div><div class="t">🏆 '+esc(tname(res.champ))+'</div>';
    if(res.second!==undefined && res.second!==null){
      h += '<div class="l" style="margin-top:8px">2. '+esc(tname(res.second))
         + (res.third && res.third.w!==undefined ? ' · 3. '+esc(tname(res.third.w)) : '') + '</div>';
    }
    h += '</div>';
  }
  return h;
}

function matchRow(a, b, obj, R, isKO, key){
  const sets = obj.s || [];
  const ev = evalMatch(sets, R, isKO);
  const open = a===undefined || b===undefined || a===null || b===null;
  const rows = open ? 1 : Math.max(1, Math.min(ev.maxRows, ev.played + (matchDone(ev) ? 0 : 1)));
  const na = a===undefined||a===null ? '<span class="tbd">offen</span>' : esc(tname(a));
  const nb = b===undefined||b===null ? '<span class="tbd">offen</span>' : esc(tname(b));

  let inputs = '';
  for(let i=0;i<rows;i++){
    const v = sets[i] || ['',''];
    inputs += '<div class="sr">'
      + '<input type="text" inputmode="numeric" maxlength="3" data-k="'+key+i+'|a" value="'+esc(v[0])+'" '+(open?'disabled':'')+'>'
      + '<span class="vs">:</span>'
      + '<input type="text" inputmode="numeric" maxlength="3" data-k="'+key+i+'|b" value="'+esc(v[1])+'" '+(open?'disabled':'')+'>'
      + '</div>';
  }
  let note = '';
  if(!open){
    const last = sets[rows-1];
    const prob = last ? setProblem(last[0], last[1], R) : null;
    if(prob) note = '<div class="mnote open">Satz '+rows+': '+prob+'</div>';
    else if(ev.drawn) note = '<div class="mnote">unentschieden'+(R.sets>1?' · Sätze '+ev.wa+':'+ev.wb:'')+'</div>';
    else if(R.sets>1 && ev.played>0) note = '<div class="mnote">Sätze '+ev.wa+':'+ev.wb+'</div>';
  }
  return '<div class="m">'
    + '<div class="side'+(ev.w==='a'?' win':'')+'">'+na+'</div>'
    + '<div class="sc">'+inputs+'</div>'
    + '<div class="side r'+(ev.w==='b'?' win':'')+'">'+nb+'</div></div>' + note;
}

/* ---------- Eingaben ---------- */
function holder(type, idx){
  if(type==='g') return S.gm[+idx];
  if(type==='k'){ const p = idx.split('-'); return S.ko.rounds[+p[0]][+p[1]]; }
  return S.ko.third;
}
function setScore(k, val){
  const p = k.split('|');            /* typ | index | satz | seite */
  const o = holder(p[0], p[1]); if(!o) return;
  const i = +p[2];
  o.s = o.s || [];
  while(o.s.length <= i) o.s.push(['','']);
  o.s[i][p[3]==='a' ? 0 : 1] = val;
}

app.addEventListener('input', e=>{
  const el = e.target;
  const clean = v => v.replace(/[^0-9]/g,'').slice(0,3);
  if(el.dataset && el.dataset.k){
    const v = clean(el.value);
    if(v!==el.value) el.value = v;
    setScore(el.dataset.k, v); save(); render();
  } else if(el.dataset && el.dataset.target){
    const v = clean(el.value);
    if(v!==el.value) el.value = v;
    S.rules[el.dataset.target].target = v==='' ? null : +v;
    save(); render();
  }
});
app.addEventListener('keydown', e=>{ if(e.key==='Enter' && e.target.id==='pname'){ e.preventDefault(); addPlayer(); } });

function addPlayer(){
  const inp = $('#pname'); if(!inp) return;
  const v = inp.value.trim(); if(!v) return;
  S.players.push(v); save(); render();
  const i = $('#pname'); if(i){ i.value=''; i.focus(); }
}

app.addEventListener('click', e=>{
  const t = e.target.closest('button'); if(!t) return;
  if(t.id==='padd'){ addPlayer(); return; }
  if(t.dataset.del!==undefined){ S.players.splice(+t.dataset.del,1); save(); render(); return; }
  if(t.id==='clearAll'){ if(confirm('Alle Namen löschen?')){ S.players=[]; save(); render(); } return; }
  if(t.id==='toggleRules'){ S.showRules=!S.showRules; save(); render(); return; }

  const seg = t.parentElement && t.parentElement.dataset ? t.parentElement.dataset.seg : null;
  if(seg){
    const v = t.dataset.v;
    if(seg.indexOf('r:')===0){
      const p = seg.split(':');          /* r : g|k : sets|two */
      S.rules[p[1]][p[2]] = p[2]==='two' ? v==='1' : +v;
    }
    else if(seg==='mode') S.mode = v;
    else if(seg==='koAfterGroups') S.koAfterGroups = v==='1';
    else S[seg] = +v;
    save(); render(); return;
  }

  if(t.id==='start'){ startTournament(); return; }
  if(t.id==='mkko'){ S.ko = buildKO(qualifiers()); save(); render(); window.scrollTo({top:document.body.scrollHeight,behavior:'smooth'}); return; }
  if(t.id==='reshuffle'){ if(confirm('Teams und Spielplan neu auslosen? Alle Ergebnisse gehen verloren.')) startTournament(); return; }
  if(t.id==='reset'){
    if(confirm('Neues Turnier starten? Ergebnisse werden gelöscht (Namen und Regeln bleiben).')){
      const keep = {players:S.players, teamSize:S.teamSize, mode:S.mode, nGroups:S.nGroups, qual:S.qual, koAfterGroups:S.koAfterGroups, rules:S.rules};
      S = Object.assign(fresh(), keep);
      save(); render(); window.scrollTo({top:0});
    }
    return;
  }
});

function startTournament(){
  S.teams = makeTeams();
  S.ko = null; S.gm = []; S.groups = [];
  if(S.mode==='ko'){
    S.ko = buildKO(shuffle(S.teams.map(t=>t.id)).map(id=>({id:id, g:null, tier:0})));
  } else {
    const ids = shuffle(S.teams.map(t=>t.id));
    const n = Math.min(S.nGroups, Math.max(1, Math.floor(ids.length/2)));
    S.groups = Array.from({length:n},()=>[]);
    ids.forEach((id,i)=> S.groups[i%n].push(id));
    buildGroupMatches();
  }
  S.phase='turnier'; save(); render(); window.scrollTo({top:0});
}

render();
})();
</script>
