# Holt Spiele und Tabellen des Vereins (verein.json) von der FLF und legt sie als
# data/fussball.json ab (gelesen von index.html), dazu je Mannschaft ein Kalender-Abo unter kalender/*.ics.
name: Fussball-Daten

on:
  schedule:
    # Zeiten in UTC (GitHub kennt keine Zeitzone). Luxemburg ist UTC+1, im Sommer UTC+2.
    # GitHub startet geplante Läufe oft verspätet oder lässt sie aus. Wer es pünktlicher will:
    # tools/anstoss-worker.js (Cloudflare) stößt diesen Workflow alle 15 min an.
    # Samstag und Sonntag stündlich (7:17–21:17 Winterzeit).
    - cron: "17 6-20 * * 0,6"
    # Montag bis Freitag einmal abends (20:17 Winterzeit).
    - cron: "17 19 * * 1-5"
    # Jeden Abend spät, für Abendspiele.
    - cron: "37 22 * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write   # für das Wach-halten unten

concurrency:
  group: fussball
  cancel-in-progress: false

jobs:
  abruf:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node test/fussball.mjs
      - run: node tools/fussball.mjs
      - name: Commit, falls sich etwas geändert hat
        run: |
          git add data/fussball.json kalender
          if git diff --cached --quiet; then echo "keine Änderung"; exit 0; fi
          git config user.name "fussball-abruf"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Fußball: Daten aktualisiert"
          for i in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep $((i * 10))
          done
          exit 1
      # GitHub schaltet Zeitpläne nach 60 Tagen ohne Repo-Aktivität ab, und Abfragen allein
      # zählt nicht. Selbst wieder einschalten setzt die Frist zurück, ohne Leer-Commits.
      - name: Zeitplan wach halten
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/fussball.yml/enable"
